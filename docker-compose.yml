services:
  # OpenSearch for article storage and k-NN clustering
  opensearch:
    image: opensearchproject/opensearch:2.11.1
    container_name: dorothy-opensearch
    environment:
      - discovery.type=single-node
      - OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m
      - DISABLE_SECURITY_PLUGIN=true
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    ports:
      - "9200:9200"
      - "9600:9600"
    networks:
      - dorothy-net
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -q 'green\\|yellow'"]
      interval: 10s
      timeout: 5s
      retries: 10

  # OpenSearch Dashboards (optional, for debugging)
  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:2.11.1
    container_name: dorothy-dashboards
    profiles:
      - debug
    ports:
      - "5601:5601"
    environment:
      - OPENSEARCH_HOSTS=["http://opensearch:9200"]
      - DISABLE_SECURITY_DASHBOARDS_PLUGIN=true
    networks:
      - dorothy-net
    depends_on:
      opensearch:
        condition: service_healthy

  # ── Scrape layer ────────────────────────────────────────────────
  # Fetcher: pulls RSS, embeds inline, populates the articles index.
  fetcher:
    build: .
    container_name: dorothy-fetcher
    restart: unless-stopped
    command: python -m scripts.run_fetch --daemon --interval 10
    environment:
      - OPENSEARCH_HOST=opensearch
      - OPENSEARCH_PORT=9200
      - OPENSEARCH_USE_SSL=false
      - EMBEDDING_BASE_URL=${EMBEDDING_BASE_URL:-http://host.docker.internal:1234}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-text-embedding-mxbai-embed-large-v1}
    networks:
      - dorothy-net
    extra_hosts:
      - "host.docker.internal:host-gateway"
      - "macstudio.cmm.local:${MACSTUDIO_IP:-192.168.0.153}"
    depends_on:
      opensearch:
        condition: service_healthy

  # Extractor: scrapes full article body text for every article missing one.
  # Runs continuously so the publisher can mine facts across the whole corpus.
  extractor:
    build: .
    container_name: dorothy-extractor
    restart: unless-stopped
    command: python -m scripts.run_extraction --daemon --workers 10 --interval 120
    environment:
      - OPENSEARCH_HOST=opensearch
      - OPENSEARCH_PORT=9200
      - OPENSEARCH_USE_SSL=false
    networks:
      - dorothy-net
    depends_on:
      opensearch:
        condition: service_healthy

  # ── Publish layer ───────────────────────────────────────────────
  # Publisher: cluster -> synthesize -> render -> deploy (hourly).
  # Trusts fetcher + extractor to keep the index populated.
  publisher:
    build: .
    container_name: dorothy-publisher
    restart: unless-stopped
    command: python -m scripts.run_pipeline --skip-fetch --interval 60 --publish --stories 20
    environment:
      - OPENSEARCH_HOST=opensearch
      - OPENSEARCH_PORT=9200
      - OPENSEARCH_USE_SSL=false
      - LLM_BASE_URL=${LLM_BASE_URL:-http://host.docker.internal:1234}
      - LLM_MODEL=${LLM_MODEL:-mlx-community/qwen3.5-35b-a3b}
      - LLM_SKIP_THINKING=${LLM_SKIP_THINKING:-true}
      - LLM_TEMPERATURE=0.3
      - LLM_MAX_TOKENS=4096
      - LLM_CONTEXT_LENGTH=${LLM_CONTEXT_LENGTH:-32768}
      - EMBEDDING_BASE_URL=${EMBEDDING_BASE_URL:-http://host.docker.internal:1234}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-text-embedding-mxbai-embed-large-v1}
      - S3_BUCKET=${S3_BUCKET}
      - AWS_REGION=${AWS_REGION:-us-east-1}
      - CLOUDFRONT_ID=${CLOUDFRONT_ID:-}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
    volumes:
      - ./output:/app/output
      - ${HOME}/.aws:/root/.aws:ro
    networks:
      - dorothy-net
    extra_hosts:
      - "host.docker.internal:host-gateway"
      - "macstudio.cmm.local:${MACSTUDIO_IP:-192.168.0.153}"
    depends_on:
      opensearch:
        condition: service_healthy

  # One-shot pipeline run (for testing)
  pipeline-once:
    build: .
    container_name: dorothy-pipeline-once
    profiles:
      - manual
    command: python -m scripts.run_pipeline --once
    environment:
      - OPENSEARCH_HOST=opensearch
      - OPENSEARCH_PORT=9200
      - OPENSEARCH_USE_SSL=false
      - LLM_BASE_URL=${LLM_BASE_URL:-http://host.docker.internal:1234}
      - LLM_MODEL=${LLM_MODEL:-mlx-community/qwen3.5-35b-a3b}
      - LLM_SKIP_THINKING=${LLM_SKIP_THINKING:-true}
      - EMBEDDING_BASE_URL=${EMBEDDING_BASE_URL:-http://host.docker.internal:1234}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-text-embedding-mxbai-embed-large-v1}
    networks:
      - dorothy-net
    extra_hosts:
      - "host.docker.internal:host-gateway"
      - "macstudio.cmm.local:${MACSTUDIO_IP:-192.168.0.153}"
    depends_on:
      opensearch:
        condition: service_healthy

  # Static site render only (for testing)
  render:
    build: .
    container_name: dorothy-render
    profiles:
      - manual
    command: python -m scripts.render_static --clean
    environment:
      - OPENSEARCH_HOST=opensearch
      - OPENSEARCH_PORT=9200
      - OPENSEARCH_USE_SSL=false
    volumes:
      - ./output:/app/output
    networks:
      - dorothy-net
    depends_on:
      opensearch:
        condition: service_healthy

  # Local web server (for testing before S3 deploy)
  web:
    build: .
    container_name: dorothy-web
    profiles:
      - dev
    command: python -m scripts.run_server --host 0.0.0.0
    ports:
      - "8000:8000"
    environment:
      - OPENSEARCH_HOST=opensearch
      - OPENSEARCH_PORT=9200
      - OPENSEARCH_USE_SSL=false
    networks:
      - dorothy-net
    depends_on:
      opensearch:
        condition: service_healthy

  # Podcast generator (independent hourly schedule, deploys podcast files to S3 after each episode)
  podcast:
    build:
      context: .
      dockerfile: Dockerfile.podcast
    container_name: dorothy-podcast
    restart: unless-stopped
    command: python -m scripts.run_podcast --daemon --interval 60 --publish
    environment:
      - OPENSEARCH_HOST=opensearch
      - OPENSEARCH_PORT=9200
      - OPENSEARCH_USE_SSL=false
      - LLM_BASE_URL=${LLM_BASE_URL:-http://host.docker.internal:1234}
      - LLM_MODEL=${LLM_MODEL:-mlx-community/qwen3.5-35b-a3b}
      - LLM_SKIP_THINKING=${LLM_SKIP_THINKING:-true}
      - LLM_TEMPERATURE=0.3
      - LLM_MAX_TOKENS=4096
      - LLM_CONTEXT_LENGTH=${LLM_CONTEXT_LENGTH:-32768}
      - PODCAST_ENABLED=true
      - PODCAST_TTS_DEVICE=cpu
      - PODCAST_VOICE_REF=config/voices/default.wav
      # S3 deployment
      - S3_BUCKET=${S3_BUCKET}
      - AWS_REGION=${AWS_REGION:-us-east-1}
      - CLOUDFRONT_ID=${CLOUDFRONT_ID:-}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
    volumes:
      - ./output:/app/output
      - ./config/voices:/app/config/voices:ro
      # Mount AWS credentials if using file-based auth
      - ${HOME}/.aws:/root/.aws:ro
    networks:
      - dorothy-net
    extra_hosts:
      - "host.docker.internal:host-gateway"
      - "macstudio.cmm.local:${MACSTUDIO_IP:-192.168.0.153}"
    depends_on:
      opensearch:
        condition: service_healthy

volumes:
  opensearch-data:

networks:
  dorothy-net:
    driver: bridge
